spring.application.name=demo1_Conference_Talks_API

# Подключение к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1118
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Liquibase (Lesson 24)
spring.liquibase.change-log=classpath:db/changelog/changelog-master.yaml
spring.liquibase.enabled=true

# Logging (Lesson 21 Task 6)
logging.level.com.example.demo1_conference_talks_api=DEBUG

# Scheduler (Lesson 22 Task 11 & Task 12)
conference.report.rate-ms=30000
spring.task.scheduling.pool.size=2
