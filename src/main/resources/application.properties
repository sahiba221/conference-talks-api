spring.application.name=demo1_Conference_Talks_API

# Подключение к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1118
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки JPA / Hibernate
# update — автоматически обновляет структуру таблиц при изменении сущностей
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
# Вывод SQL-запросов в консоль
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Диалект для PostgreSQL (в новых версиях Spring Boot определяется автоматически, но можно указать явно)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/changelog-master.yaml
spring.liquibase.enabled=true
